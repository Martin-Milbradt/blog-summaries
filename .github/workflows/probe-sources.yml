name: Probe Sources

# Manual experiment: which candidate feed sources answer from a GitHub Actions
# runner. Prints one line per URL with the HTTP status, content type and size.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl each source
        run: |
          probe() {
            local label="$1" url="$2"
            shift 2
            printf '%-32s ' "$label"
            curl -sS -o body.tmp -w '%{http_code} %{content_type} %{size_download}B\n' \
              --max-time 30 "$@" "$url" || echo "curl failed"
            head -c 200 body.tmp | tr '\n' ' '
            echo
            echo
          }
          UA_BOT='Mozilla/5.0 (zvi-summaries; +https://github.com/Martin-Milbradt/zvi-summaries)'
          UA_CHROME='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'

          probe "substack rss (bot UA)"        https://blog.redwoodresearch.org/feed -A "$UA_BOT"
          probe "substack rss (chrome UA)"     https://blog.redwoodresearch.org/feed -A "$UA_CHROME"
          probe "substack archive api"         'https://blog.redwoodresearch.org/api/v1/archive?sort=new&offset=0&limit=5' -A "$UA_CHROME"
          probe "substack post api"            https://blog.redwoodresearch.org/api/v1/posts/an-operationalization-of-opaque-serial-depth -A "$UA_CHROME"
          probe "zvi substack rss (control)"   https://thezvi.substack.com/feed -A "$UA_CHROME"
          probe "zvi wordpress rss (control)"  https://thezvi.wordpress.com/feed/ -A "$UA_BOT"
          probe "website listing"              https://www.redwoodresearch.org/blog -A "$UA_BOT"
          probe "website post"                 https://www.redwoodresearch.org/blog/an-operationalization-of-opaque-serial-depth -L -A "$UA_BOT"
          probe "alignment forum api"          https://www.alignmentforum.org/api/post/an-operationalization-of-opaque-serial-depth -A "$UA_BOT"
