name: Update Feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.13

      - run: uv sync

      - name: Generate feeds
        env:
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          KNOWLEDGE_CUTOFF: ${{ vars.KNOWLEDGE_CUTOFF }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
        run: uv run blog-summaries

      # always(): a refused article fails the previous step on purpose, but the
      # summaries it did produce are already on disk and must still land.
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update feed summaries"
          git push
